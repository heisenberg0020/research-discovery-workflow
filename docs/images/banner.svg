<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 430" role="img" aria-labelledby="title desc">
  <title id="title">Research Discovery Workflow</title>
  <desc id="desc">Understand the field, construct a concrete mechanism, review before reconciliation, and explain a discriminating research plan. An illustrative workflow banner, not a performance chart.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fb"/>
      <stop offset="1" stop-color="#e7eef4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c5976"/>
      <stop offset="1" stop-color="#487c8c"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="430" rx="28" fill="url(#background)"/>
  <g fill="none" stroke="#c7d7e3" opacity="0.65">
    <circle cx="1310" cy="76" r="120"/>
    <circle cx="1310" cy="76" r="165"/>
    <path d="M1110 20v165M1035 85h340"/>
  </g>
  <rect x="64" y="56" width="5" height="128" rx="2.5" fill="url(#accent)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="91" y="80" fill="#426c83" font-size="17" font-weight="700" letter-spacing="3">EVIDENCE · MECHANISM · INSIGHT</text>
    <text x="88" y="134" fill="#19384e" font-size="47" font-weight="700">Research Discovery Workflow</text>
    <text x="91" y="176" fill="#476174" font-size="23">Understand the field. Build the mechanism. Make the plan.</text>
    <g transform="translate(64 230)">
      <g fill="#fff" stroke="#c9d8e3">
        <rect width="230" height="110" rx="16"/>
        <rect x="265" width="230" height="110" rx="16"/>
        <rect x="530" width="230" height="110" rx="16"/>
        <rect x="795" width="230" height="110" rx="16"/>
        <rect x="1060" width="250" height="110" rx="16"/>
      </g>
      <g stroke="#7895aa" stroke-width="2" fill="none">
        <path d="M237 55h19m-6-6 6 6-6 6"/>
        <path d="M502 55h19m-6-6 6 6-6 6"/>
        <path d="M767 55h19m-6-6 6 6-6 6"/>
        <path d="M1032 55h19m-6-6 6 6-6 6"/>
      </g>
      <g fill="#2c5976" font-size="12" font-weight="700" letter-spacing="1.5">
        <text x="20" y="29">01 / DISCOVER</text>
        <text x="285" y="29">02 / CONSTRUCT</text>
        <text x="550" y="29">03 / REVIEW</text>
        <text x="815" y="29">04 / RECONCILE</text>
        <text x="1080" y="29">05 / EXPLAIN</text>
      </g>
      <g fill="#233f54" font-size="19" font-weight="600">
        <text x="20" y="61">Field × methods</text>
        <text x="285" y="61">Concrete proposal</text>
        <text x="550" y="61">Repair before merge</text>
        <text x="815" y="61">Prior work, if any</text>
        <text x="1080" y="61">Plan → insight</text>
      </g>
      <g fill="#637e91" font-size="13.5">
        <text x="20" y="87">Independent first judgments</text>
        <text x="285" y="87">Relations, not module names</text>
        <text x="550" y="87">Preserve the original Q5</text>
        <text x="815" y="87">A conditional handoff</text>
        <text x="1080" y="87">Comparison before reporting</text>
      </g>
    </g>
    <text x="64" y="390" fill="#607b8e" font-size="15">Q0–Q7 · Fresh-context exploration · Concrete hypotheses · Honest conditional planning</text>
  </g>
</svg>
