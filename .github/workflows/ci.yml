name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-06
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-10-06
        with:
          python-version: ${{ matrix.python }}
      - name: Frozen workflow and public repository checks
        run: python scripts/check_repo.py
      - name: Unit and distribution tests (no model calls)
        run: python -m unittest discover -s tests -v
      - name: Build and verify the current source bundle
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          with tempfile.TemporaryDirectory(prefix="discovery-ci-release-") as directory:
              destination = Path(directory) / "release"
              subprocess.run([sys.executable, "scripts/build_release.py", "--output", str(destination)], check=True)
              archive, = destination.glob("*.zip")
              subprocess.run([sys.executable, "scripts/build_release.py", "--verify", str(archive)], check=True)
