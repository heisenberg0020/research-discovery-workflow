name: Repository improvement
description: Suggest clearer onboarding, examples, documentation or distribution.
body:
  - type: textarea
    id: need
    attributes:
      label: What user difficulty would this address?
      description: Explain the concrete situation and expected improvement. Do not include private research artifacts.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and validation
      description: The research workflow is frozen; explain whether your proposal touches it. More rules or files alone are not evidence of improvement.
